# yaml-language-server: $schema=https://unpkg.com/@powersync/service-schema@latest/json-schema/powersync-config.json
#
# PowerSync service config for the local stack (powersync/docker-compose.yaml).

telemetry:
  disable_telemetry_sharing: true

replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable

storage:
  type: postgresql
  uri: !env PS_STORAGE_SOURCE_URI
  sslmode: disable

port: !env PS_PORT

sync_config:
  path: sync-config.yaml

client_auth:
  # Supabase Auth: public keys come from its JWKS, through Kong, Supabase's gateway.
  supabase: true
  jwks_uri: http://kong:8000/auth/v1/.well-known/jwks.json
  audience: ['authenticated']
